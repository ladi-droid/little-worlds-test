# Publishes the test site to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
# Waits up to 30 minutes for GitHub to copy the files (the built-in deploy gives up after 10),
# and can be started again by hand from the Actions tab ("Run workflow").
name: Deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
