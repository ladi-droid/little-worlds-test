# Publishes the test site to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
# If GitHub hiccups (slow file copy, or it can't find the upload yet), it waits a minute and
# tries once more. It can also be started again by hand from the Actions tab ("Run workflow").
name: Deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 10 minutes is the most GitHub allows for one try.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}" >> "$GITHUB_OUTPUT"
