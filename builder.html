<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/A.png">
<title>Build Their World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* Layout: the landing page's rooftop scene is the live preview. Desktop: scene on the left (sticky), steps on the right. Phone: scene on top with a torn edge, steps below, sticky Next bar. Single light look on purpose (the brand: cream, yellow, black). */
:root{
  color-scheme:light;
  --paper:#f6efe3; --card:#fbf7ee; --ink:#0b0b0e; --sun:#ffd23a; --navy:#1c2a5e; --muted:#5d5a66; --green:#2f6b47; --bad:#b8321f;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:60px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
.outline{color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.hl{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%)}
.kicker{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);box-shadow:0 3px 0 rgba(11,11,14,.12)}
nav.top .in{max-width:1320px;margin:0 auto;height:var(--navh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
.mark{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:20px;text-decoration:none;white-space:nowrap}
.mark .tile{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--sun);border:3px solid var(--ink);border-radius:10px;transform:rotate(-6deg);font-size:18px;transition:transform .3s}
.mark .tile.flip{transform:rotate(6deg) scale(1.1)}
.steps{display:flex;align-items:center;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:6px}
.steps li+li::before{content:"";width:14px;height:3px;border-radius:2px;background:rgba(11,11,14,.18)}
.steps li.done+li::before,.steps li.on::before{background:var(--ink)}
.steps button{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--muted)}
.steps button[disabled]{cursor:default}
.steps .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid rgba(11,11,14,.25);background:var(--card);font-family:var(--display);font-size:13px;color:var(--muted)}
.steps .on .n{background:var(--sun);border-color:var(--ink);color:var(--ink);transform:scale(1.12)}
.steps .on button{color:var(--ink)}
.steps .done .n{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.steps .t{display:none}
.mock{font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:2px 9px;background:#fff;white-space:nowrap}
@media (min-width:1100px){.steps .t{display:inline}.steps li+li::before{width:22px}}
@media (max-width:899px){.mock{display:none}}
@media (max-width:640px){.steps,.steps li{gap:5px}.steps li+li::before{display:none}.steps .n{width:28px;height:28px}.steps .on .n{transform:scale(1.08)}}
@media (max-width:360px){.mark{font-size:17px}.steps,.steps li{gap:3px}.steps .n{width:26px;height:26px;font-size:12px}}

/* layout */
.layout{max-width:1320px;margin:0 auto}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start;padding:18px clamp(18px,3vw,36px) 0}
}

/* stage: the rooftop scene from the landing page */
.stagewrap{filter:drop-shadow(0 6px 0 rgba(11,11,14,.9))}
.stage{position:relative;overflow:hidden;isolation:isolate;height:300px;background:#f7c99a url(hero_scene.webp) 46% bottom/cover no-repeat;clip-path:var(--tear-b);transition:height .3s ease}
.stage canvas.props{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage canvas.kid{position:absolute;z-index:2;bottom:4.5%;transform:translateX(-50%);transform-origin:50% 100%;width:auto}
.stage canvas.kid.back{left:52%;height:calc(42% * var(--k,1));animation:breathe 3.6s ease-in-out infinite}
.stage canvas.kid.side{left:52%;height:calc(50% * var(--k,1))}
@keyframes breathe{50%{transform:translateX(-50%) scaleY(1.012)}}
.stage .title{position:absolute;z-index:3;left:0;right:0;top:9%;text-align:center;white-space:nowrap;font-size:40px;transform:rotate(-2.5deg);-webkit-text-stroke:8px var(--ink)}
.stage .title .s{color:var(--sun)}
.stage .title .tin{display:inline-block}
.stage .title br{display:none}
.artnote{margin-top:12px;font-size:14px;font-weight:700;line-height:1.35;background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:8px 12px}
@media (max-width:899px){
  .stagewrap{position:relative;z-index:5}
  .stagewrap.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh))}
  .stagewrap.stick .stage{height:250px}
}
@media (min-width:900px){
  .stagewrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 18px)}
  .stage{height:calc(100vh - var(--navh) - 52px);min-height:520px;max-height:860px;clip-path:var(--tear-tb);background-position:center bottom}
  .stage canvas.kid.back{left:58%;height:calc(34% * var(--k,1))}
  .stage canvas.kid.side{left:58%;height:calc(38% * var(--k,1))}
  .stage .title{top:8%;font-size:clamp(48px,5.6vw,88px);-webkit-text-stroke:clamp(9px,1.1vw,13px) var(--ink);white-space:normal}
  .stage .title br{display:inline}
}

/* step column */
.col{padding:26px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));max-width:600px;margin:0 auto;min-height:calc(100vh - var(--navh) - 300px);display:flex;flex-direction:column}
@media (min-width:900px){.col{padding:22px 0 0;margin:0;min-height:calc(100vh - var(--navh) - 18px)}}
.panel{display:flex;flex-direction:column;gap:22px;flex:1;padding-bottom:20px}
.panel h2{font-size:clamp(32px,4.4vw,48px);margin-top:6px}
.lede{font-weight:600;color:var(--muted);margin-top:10px;max-width:44ch}
.fine{font-size:14px;font-weight:600;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;background:var(--sun);border:3px solid var(--ink);
  font-family:var(--display);font-size:17px;letter-spacing:.03em;text-decoration:none;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.pill:hover{transform:translateY(-1px)}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.pill.ghost{background:#fff}
.pill.wide{width:100%}
.pill[disabled]{background:#e4dccd;color:#8a8590;border-color:#8a8590;box-shadow:0 5px 0 #8a8590;cursor:not-allowed;transform:none}

/* sticky bottom bar */
.bar{position:sticky;bottom:0;z-index:6;display:flex;gap:10px;padding:22px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(246,239,227,0),var(--paper) 34%)}
.bar .pill{flex:1;min-width:0}
.bar .pill.two{white-space:normal;line-height:1.1;text-align:center;padding-inline:12px;font-size:15px}
.bar .back{flex:0 0 auto;padding-inline:20px}

/* fields */
.lab{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.box{display:flex;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink);padding:4px 6px 4px 22px}
.box:focus-within{outline:3px solid var(--navy);outline-offset:4px}
.box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:800;font-size:24px;padding:10px 0}
.box .sfx{font-weight:700;color:var(--muted);font-size:17px;padding-right:14px;white-space:nowrap}
.box.url input{text-align:right;font-size:21px}
.hint{font-size:15px;font-weight:700;color:var(--muted);min-height:1.5em;margin-top:12px}
.hint.bad{color:var(--bad)} .hint.good{color:var(--green)}
.hint.good::before{content:"✓ "}

/* look */
.opts{display:flex;flex-direction:column;gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:8px 15px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.on{background:var(--sun)}
.chip em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:var(--ink);color:#fff;border-radius:99px;padding:1px 7px;margin-left:7px;vertical-align:2px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 3px 0 var(--ink)}
.sw button.on{outline:3px solid var(--ink);outline-offset:3px}
.group{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.group .sub{font-weight:800;font-size:15px;min-width:66px}
.mix{align-self:flex-start}
@media (max-width:520px){.group{grid-template-columns:1fr;gap:6px}.group .sub{margin-top:6px}.sw{gap:8px}.sw button{width:34px;height:34px}}

/* trips */
.picked{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:38px}
.picked .count{font-family:var(--display);font-size:15px;background:var(--ink);color:var(--sun);border-radius:99px;padding:5px 13px}
.picked span.p{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.picked span.p b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);font-size:11px;margin-right:6px;vertical-align:1px}
.picked .empty{color:var(--muted);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding-top:6px}
@media (min-width:560px) and (max-width:899px),(min-width:1180px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wc{position:relative;display:block;width:100%;text-align:left;border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--c);box-shadow:0 5px 0 var(--ink);transition:transform .15s,opacity .15s}
.wc:nth-child(odd){transform:rotate(-1.2deg)} .wc:nth-child(even){transform:rotate(1deg)}
.wc img.pic{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;border-bottom:4px solid var(--ink);background:#ddd}
.wc .plate{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 11px;color:#fff;min-height:48px}
.wc .plate b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.05;letter-spacing:.03em;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.wc .stamp{position:absolute;right:6px;top:6px;width:48px;height:48px;object-fit:contain;transform:rotate(10deg)}
.wc .bonus{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:1px 7px}
.wc .num{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:18px;box-shadow:0 3px 0 var(--ink)}
.wc.on{transform:translateY(-5px) rotate(0);box-shadow:0 0 0 4px var(--sun),0 0 0 7px var(--ink),0 10px 0 4px var(--ink)}
.wc.full{opacity:.45}
.cityf{display:flex;flex-wrap:wrap;gap:9px}
.cityh{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;margin:8px 0 -4px}
.cityh img{width:52px;height:auto;transform:rotate(-6deg)}
.cityh small{font-family:var(--body);font-weight:700;font-size:14px;color:var(--muted)}
.wc.more{display:grid;place-items:center;text-align:center;background:var(--card);border-style:dashed;box-shadow:none;padding:18px;cursor:default}
.wc.more b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.wc.more p{font-size:14px;font-weight:600;color:var(--muted);margin-top:8px}

/* link */
.sugg{display:flex;flex-wrap:wrap;gap:9px}

/* play + pay */
.phone{position:relative;width:min(100%,440px);aspect-ratio:19.5/9;margin:4px auto 0;border:6px solid var(--ink);border-radius:26px;overflow:hidden;background:#89b6e0;transform:rotate(-2deg);box-shadow:0 7px 0 rgba(11,11,14,.85)}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phone .ptitle{position:absolute;left:0;right:0;top:11%;text-align:center;font-size:clamp(24px,7vw,34px);-webkit-text-stroke:6px var(--ink);transform:rotate(-2deg);white-space:nowrap}
.phone .ptitle .s{color:var(--sun)}
.phone canvas{position:absolute;left:0;bottom:7%;width:100%;height:40%}
.phone .ribbon{position:absolute;right:10px;bottom:8px;background:var(--sun);border:2px solid var(--ink);border-radius:99px;font-weight:800;font-size:11px;padding:2px 9px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.summary dt{font-weight:800;color:var(--muted)} .summary dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px;align-self:center}
.toggle button{padding:9px 20px;border-radius:999px;font-weight:800}
.toggle button.on{background:var(--ink);color:#fff}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.plan{text-align:left;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.plan.on{background:var(--sun);transform:translateY(-3px)}
.plan h3{font-size:20px}
.plan .price{font-family:var(--display);font-size:clamp(34px,5vw,46px);line-height:1;font-variant-numeric:tabular-nums}
.plan .price small{font-family:var(--body);font-weight:700;font-size:15px;color:var(--muted)}
.plan ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.plan li::before{content:"✓";font-weight:800;margin-right:8px}
@media (max-width:420px){.plans{grid-template-columns:1fr}}

/* done */
.big{font-size:clamp(46px,8vw,76px);transform:rotate(-2deg);-webkit-text-stroke:clamp(8px,1.2vw,11px) var(--ink);align-self:flex-start}
.linkbox{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:0 5px 0 var(--ink)}
.linkbox code{flex:1;min-width:0;font:800 17px/1.3 var(--body);overflow-wrap:anywhere;user-select:all}
.linkbox .pill{padding:9px 16px;font-size:14px;box-shadow:none}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:10px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:800}
.tabs button.on{background:var(--ink);color:#fff}
ol.how{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;font-weight:600}
ol.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.how li::before{content:counter(s);flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);font-family:var(--display);font-size:13px}
ol.how b{font-weight:800}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(11,11,14,.55);display:grid;place-items:end center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{place-items:center}}
.sheet>div{width:min(100%,480px);background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;box-shadow:0 8px 0 var(--ink)}
.sheet h2{font-size:30px}
.sso{width:100%;font-family:var(--body);font-weight:800;font-size:17px;letter-spacing:0}
.sso.apple{background:var(--ink);color:#fff}
.sso .g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);font-family:var(--display);font-size:12px}
.or{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:2px;background:rgba(11,11,14,.15)}
.stack{display:flex;flex-direction:column;gap:12px}
.sheet .box input{font-size:19px}
.textbtn{align-self:center;font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--sun);text-underline-offset:4px;padding:6px}
.navlink{font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap}
.navlink:hover{text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--sun)}
.navr{display:flex;align-items:center;gap:14px}
@media (max-width:640px){.navlink{display:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.who{display:flex;gap:12px}.who button{flex:1;max-width:150px;border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:6px 4px 0;cursor:pointer;display:grid;place-items:center}
.who button.on{background:var(--sun);box-shadow:0 4px 0 var(--ink)}.who button{padding:10px 4px}.who canvas{height:110px;width:auto;display:block;margin:auto}
.chips.pics .chip{display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:4px 10px 8px;border-radius:18px}.chips.pics canvas{height:64px;width:64px;display:block}</style>
<script src="qr.js"></script>
<script src="kids/kids-meta.js?v=1794418313"></script>
<script src="kids/kids.js?v=1794418313"></script>
<style>.qr{display:grid;place-items:center;margin:4px auto 0;padding:12px;background:#fff;border-radius:16px;width:max-content;box-shadow:0 2px 0 rgba(0,0,0,.08)}.qr svg{display:block;width:200px;height:200px}#theLink{word-break:break-all;font-size:12px}</style>
<style>
.bm{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);padding:24px 16px;text-align:center;opacity:0;transition:opacity .4s}
.bm.in{opacity:1}
.bm .k{font:800 15px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bm h2{font-size:clamp(36px,11vw,72px);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);max-width:16ch}
.bm canvas{width:min(92vw,520px);height:min(42vh,340px)}
.bm .msg{min-height:1.4em;font:800 clamp(18px,4.6vw,24px)/1.3 var(--body);transition:opacity .3s,transform .3s}
.bm .msg.out{opacity:0;transform:translateY(8px)}
.bm .bmbar{width:min(80vw,420px);height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.bm .bmbar i{display:block;height:100%;width:0;background:var(--sun);border-right:3px solid var(--ink)}
.bm.done h2{animation:bmPop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bmPop{0%{scale:.6}100%{scale:1}}
</style>

function tear(seed,edges){

  const n=36,amp=14,top=[],bot=[];
  for(let i=0;i<=n;i++){const x=(i/n*100).toFixed(2)+'%';top.push(`${x} ${(rnd()*amp).toFixed(1)}px`);bot.push(`${x} calc(100% - ${(rnd()*amp).toFixed(1)}px)`)}
  const T=edges.includes('t')?top:['0% 0%','100% 0%'];const B=edges.includes('b')?bot.reverse():['100% 100%','0% 100%'];
  return `polygon(${T.concat(B).join(',')})`;
}

function classify(r,g,b,yf){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx/255,s=mx?(mx-mn)/mx:0;let h=0;
  if(mx!==mn){if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;h*=60;if(h<0)h+=360}
  if(h>=80&&h<=175&&s>.35&&v>.08&&yf>.84)return 6;            // trainers
  if(h>=80&&h<=175&&s>.2&&v>.15&&yf<.42)return 1;             // cap
  if(h>=12&&h<=40&&s>.42&&v>.5)return 2;                       // skin

  if(h>=18&&h<=50&&s>=.09&&s<.42&&v>.55&&yf>.5&&yf<.9)return 5;// joggers (spare the soles)
  return 0;
}
function makeSprite(src,onReady){
  const sp={ready:false,cv:document.createElement('canvas')};
  const img=new Image();img.onload=()=>{
    const c=sp.cv;c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
    try{

      const d=sp.orig.data,n=d.length/4;sp.cls=new Uint8Array(n);sp.lum=new Float32Array(n);let sl=0,sn=0;
      for(let i=0;i<n;i++){const k=i*4;if(d[k+3]<20)continue;const cl=classify(d[k],d[k+1],d[k+2],Math.floor(i/c.width)/c.height);
        sp.cls[i]=cl;sp.lum[i]=.3*d[k]+.59*d[k+1]+.11*d[k+2];if(cl===6){sl+=sp.lum[i];sn++}}
      sp.shoeBase=sn?sl/sn:50;sp.ready=true;
    }catch(e){sp.ready='plain'}
    paintSprite(sp);onReady&&onReady();
  };img.src=src;return sp;
}

function paintSprite(sp){
  if(sp.ready!==true)return;

const slugify=t=>t.toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/--+/g,'-').slice(0,24);
function checkSlug(s){
  if(!s)return{ok:false,msg:'Pick a name for the link.'};
  if(s.length<3)return{ok:false,msg:'Use at least 3 letters or numbers.'};
  if(/^-|-$/.test(s))return{ok:false,msg:'The link can’t start or end with a dash.'};
  if(RESERVED.includes(s))return{ok:false,msg:`We keep “${s}” for the site. Try another name.`};
  if(RUDE.some(w=>s.includes(w)))return{ok:false,msg:'We can’t use that one. Try another name.'};
  if(TAKEN.includes(s))return{ok:false,taken:true,msg:`Another family has ${s}.${DOMAIN}.`};
  return{ok:true,msg:`${s}.${DOMAIN} is free.`};
}
function suggestions(base){
  const b=slugify(base)||'little';const out=[];
  for(const c of [b+'sworld',b+'-runs',b+'s-world',b+'world2',b+(new Date().getFullYear()%100)]){if(checkSlug(c).ok&&!out.includes(c))out.push(c);if(out.length===3)break}
  return out;
}

    if(seq.length){const tot=seq.reduce((a,q)=>a+q[1],0);let u=t%tot,q=seq[0];for(const z of seq){if(u<z[1]){q=z;break}u-=z[1]}
      const sh=sheets[q[0]],n=N[q[0]],cw=sh.width/n,pt=sh.lwPT||0,fh=sh.lwH||sh.height,f=q[2]?Math.floor(t*q[2])%n:0;

function stageFor(){
  const look=!S.paid&&S.step===1;
  kidBack.hidden=!(S.step===0&&!S.paid);kidSide.hidden=!kidBack.hidden;
  $('#stageWrap').classList.toggle('stick',look);
}
const stepSeen={};   // one "reached this step" ping per step per visit, for the admin page's set-up funnel
function render(){
  renderSteps();
  if(window.lwPing&&!S.edit&&!S.paid&&!stepSeen[S.step]){stepSeen[S.step]=1;lwPing('step',{extra:STEP_NAMES[S.step]})}
  $('#view').innerHTML=V[S.paid?'done':S.step]();stageFor();drawPicks();if(S.paid)drawQR();
  if(S.paid)bar(`<button class="pill ghost two" data-act="restart">Build another world</button><a class="pill two" href="login.html?v=1794418313#account" data-act="myacct">My account</a>`);
  else if(S.edit){const back=`<a class="pill ghost back" href="login.html?v=1794418313#account" aria-label="Back to your account">◂</a>`;
    bar(back+`<button class="pill" data-act="savechanges" ${canGo(4)?'':'disabled'}>Save changes</button>`)}
  else{
    const back=S.step>0?`<button class="pill ghost back" data-act="back" aria-label="Back">◂</button>`:'';
    if(S.step===4){const p=PRICES[S.plan],m=member();
      if(m){const room=roomLeft(m);bar(back+(m.plan==='family'?(room>0?`<button class="pill" data-act="addacct">Add to my account</button>`:`<a class="pill" href="login.html?v=1794418313#account">Manage worlds</a>`):`<button class="pill" data-act="upgrade">Switch to Family and add</button>`))}
      else bar(back+`<button class="pill" data-act="pay">Join for £${S.yearly?p.y+' a year':p.m+' a month'}</button>`)}
    else bar(back+`<button class="pill" data-act="next" ${canGo(S.step+1)?'':'disabled'}>Next: ${STEP_NAMES[S.step+1]} ▸</button>`);
  }
}
function refreshNext(){const b=document.querySelector('[data-act="next"]');if(b)b.disabled=!canGo(S.step+1);const c=document.querySelector('[data-act="savechanges"]');if(c)c.disabled=!canGo(4);renderSteps()}

function sheet(html){$('#sheetIn').innerHTML=html;$('#sheet').hidden=false;const f=$('#sheetIn button');f&&f.focus()}
const closeSheet=()=>{$('#sheet').hidden=true};
const priceTxt=()=>{const p=PRICES[S.plan];return `£${S.yearly?p.y+' a year':p.m+' a month'}`};
const snapshot=()=>{const g=JSON.parse(JSON.stringify(S));delete g.paid;delete g.edit;delete g.step;delete g.tab;return g};
let pending=null; // account details waiting for payment
function signupSheet(){
  const a=getAcct();if(a&&(a.email||a.via)){pending=a;checkoutSheet();return}
  sheet(`<p class="kicker">Step 1 of 2</p><h2>Log in or sign up</h2>
    <p>New here? We make your account as you join. Already have one? Use the same option you joined with. You won’t need a password.</p>
    <button class="pill sso apple" data-auth="apple"> Continue with Apple</button>
    <button class="pill ghost sso" data-auth="google"><span class="g">G</span> Continue with Google</button>
    <div class="or">or use your email</div>
    <form class="stack" id="emailForm" novalidate><div class="box"><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Your email"></div>
      <p class="hint" id="emHint" style="margin:0" aria-live="polite"></p>
      <button class="pill wide" type="submit">Continue to checkout ▸</button></form>
    <p class="fine">We send ${esc(nm())}’s link and your receipts to this email. To make changes later, you log in with a one-tap link we email you.</p>
    <button class="textbtn" data-close>Not now</button>`)}
function checkoutSheet(){
  const who=pending.email||(pending.via==='apple'?'Your Apple ID':'Your Google account');
  sheet(`<p class="kicker">Step 2 of 2</p><h2>Checkout</h2><p>On the real site this opens a secure card payment page (Stripe), with Apple Pay and Google Pay.</p>
    <dl class="summary"><dt>Account</dt><dd>${esc(who)}</dd><dt>Plan</dt><dd>${PRICES[S.plan].label}</dd><dt>Price</dt><dd>${priceTxt()}</dd><dt>Cancel</dt><dd>Any time</dd></dl>
    <button class="pill wide" data-act="fakepay">Pretend to pay</button><button class="textbtn" data-close>Not now</button>`)}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='emailForm'){const v=$('#em').value.trim(),h=$('#emHint');
    if(!okEmail(v)){h.textContent='Enter an email like name@example.com.';h.className='hint bad';return}
    pending={email:v,via:'email'};checkoutSheet()}
  if(e.target.id==='laterForm'){const v=$('#em2').value.trim(),h=$('#em2Hint');
    if(!okEmail(v)){h.textContent='Enter an email like name@example.com.';h.className='hint bad';return}
    sheet(`<h2>Sent</h2><p>Check your inbox for a link back to ${esc(nm())}’s World. It opens right where you left off.</p><p class="fine">Mock-up: nothing was sent.</p><button class="pill wide" data-close>OK</button>`)}
});
$('#sheet').addEventListener('click',e=>{
  const up=e.target.closest('[data-act="doupgrade"]');if(up){const a=getAcct();a.plan='family';setAcct(a);closeSheet();
    if(up.dataset.then==='add'){addToAccount()}else{Object.assign(S,{step:0,paid:false,added:false,slug:'',name:'',worlds:[]});save();updateName();render();scrollTo({top:0})}return}
  const au=e.target.closest('[data-auth]');if(au){pending={via:au.dataset.auth,email:au.dataset.auth==='apple'?'you@privaterelay.appleid.com':'you@gmail.com'};checkoutSheet();return}
  if(e.target.closest('[data-act="fakepay"]')){
    const a=getAcct()||{games:[]};a.email=pending.email;a.via=pending.via;a.plan=S.plan;a.yearly=S.yearly;a.games=a.games||[];
    const g=snapshot();const i=a.games.findIndex(x=>x.slug===g.slug);if(i>=0)a.games[i]=g;else a.games.push(g);setAcct(a);builtPing(g,S.plan);
    try{localStorage.setItem('lw_session',JSON.stringify({email:a.email}))}catch(err){}
    closeSheet();S.paid=true;S.added=false;save();lwBuildShow(()=>{render();scrollTo({top:0})});return}
  if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

const pickRand=a=>Math.floor(Math.random()*a.length);
document.addEventListener('click',e=>{
  if(e.target.closest('[data-act="myacct"]')){const a=getAcct();try{localStorage.setItem('lw_session',JSON.stringify({email:a&&a.email}))}catch(err){}return}
  const t=e.target.closest('button');if(!t||t.closest('#sheet'))return;
  const d=t.dataset;
  if(d.go){go(+d.go);return}
  if(d.act==='next'){go(S.step+1);return}
  if(d.act==='back'){go(Math.max(0,S.step-1));return}
  if(d.act==='restart'){const m=getAcct();if(m&&m.games&&m.plan!=='family'&&m.games.length>=1){upgradeSheet('restart');return}
    Object.assign(S,{step:0,paid:false,added:false,slug:'',name:'',worlds:[]});save();updateName();render();scrollTo({top:0});return}
  if(d.act==='addacct'){addToAccount();return}
  if(d.act==='upgrade'){upgradeSheet('add');return}
  if(d.act==='try'){tryPractice();return;sheet(`<h2>Practice street</h2><p>On the real site this opens a short practice street where ${esc(nm())} learns to run, jump and lean, in the look you picked. You don’t pay anything to try it.</p><p class="fine">This mock-up doesn’t include the game. You can play A’s version here: <a href="${GAME}" target="_blank" rel="noopener">A’s World</a>.</p><button class="pill wide" data-close>OK</button>`);return}
  if(d.act==='pay'){signupSheet();return}
  if(d.act==='later'){sheet(`<h2>Finish later</h2><p>We’ll email you a link back to ${esc(nm())}’s World, so you can pick up where you left off.</p>
    <form class="stack" id="laterForm" novalidate><div class="box"><input id="em2" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Your email"></div>
    <p class="hint" id="em2Hint" style="margin:0" aria-live="polite"></p><button class="pill wide" type="submit">Email me the link</button></form><button class="textbtn" data-close>Not now</button>`);return}
  if(d.act==='savechanges'){const a=getAcct();if(a&&a.games){const g=snapshot();const i=a.games.findIndex(x=>x.slug===new URLSearchParams(location.search).get('edit'));if(i>=0)a.games[i]=g;else a.games.push(g);setAcct(a)}
    sheet(`<h2>Saved</h2><p>${esc(nm())} sees the changes the next time the game opens.</p><a class="pill wide" href="login.html?v=1794418313#account">Back to your account</a>`);return}
  if(d.act==='copy'){const txt=$('#theLink').textContent,b=$('#copyBtn');
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#theLink'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'};
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copied'},sel)}catch(err){sel()}return}
  if(d.act==='mix'){const r=a=>a[pickRand(a)][0];Object.assign(S,{style:r(STYLES),skin:r(SKIN),hair:r(HAIR),hood:r(HOOD),jog:r(JOG),shoe:r(SHOE)});save();repaint();render();return}
  if(d.kid){if(S.kid!==d.kid){S.kid=d.kid;S.style='';Object.assign(S,KIDS[d.kid].look);fixLook();save();repaint();const y=scrollY;render();scrollTo({top:y,behavior:'instant'})}return}
  if(d.tab){S.tab=d.tab;save();render();return}
  if(d.chip){S[d.chip]=d.v;save();repaint();document.querySelectorAll(`[data-chip="${d.chip}"]`).forEach(b=>{const on=b.dataset.v===d.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});stageFor();return}
  if(d.sw){S[d.sw]=d.i;save();repaint();document.querySelectorAll(`[data-sw="${d.sw}"]`).forEach(b=>{const on=b.dataset.i===S[d.sw];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});return}
  if(d.w){const i=S.worlds.indexOf(d.w);if(i>=0)S.worlds.splice(i,1);else if(S.worlds.length<MAXW)S.worlds.push(d.w);else return;save();const y=scrollY;render();scrollTo({top:y,behavior:'instant'});return}
  if(d.city){S.city=d.city;save();const y=scrollY;render();scrollTo({top:y,behavior:'instant'});return}
  if(d.sg){S.slug=d.sg;save();render();return}
  if(d.plan){S.plan=d.plan;save();render();return}
  if(d.y!==undefined){S.yearly=d.y==='1';save();render();return}
});

document.addEventListener('input',e=>{
  if(e.target.id==='nm'){const v=cleanName(e.target.value);if(v!==e.target.value)e.target.value=v;S.name=v;save();updateName();
    $('#nmHint').textContent=nm()?`Welcome to ${nm()}’s World.`:'Watch the rooftop as you type.';refreshNext()}
  if(e.target.id==='slug'){const v=slugify(e.target.value);if(v!==e.target.value)e.target.value=v;S.slug=v;save();
    const c=checkSlug(v),h=$('#slugHint');h.textContent=v?c.msg:'Use letters, numbers and dashes.';h.className='hint '+(v?(c.ok?'good':'bad'):'');
    const sg=c.taken||!v?suggestions(S.name||'little'):[];const box=$('#suggBox');box.hidden=!sg.length;box.querySelector('.sugg').innerHTML=sg.map(s=>`<button class="chip" data-sg="${s}">${s}</button>`).join('');refreshNext()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nm'||e.target.id==='slug')){e.preventDefault();go(S.step+1)}});

render();
(()=>{let q;try{q=new URLSearchParams(location.search)}catch(e){return}const a=getAcct();if(q.get('fresh')&&a&&a.games&&a.games.length&&a.plan!=='family')upgradeSheet('restart')})();
if(nm())updateName();else if(reduce){tw.textContent=NAMES[0]}else{tw.textContent='';setTimeout(typeLoop,600)}
})();
</script>
</body></html>
