<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/A.png">
<title>Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* One question per screen. Each answer moves the next question up into view. Answers save in this browser and go to the Google Sheet in ENDPOINT. */
:root{
  color-scheme:light;
  --paper:#f6efe3; --card:#fbf7ee; --ink:#0b0b0e; --sun:#ffd23a; --navy:#1c2a5e; --muted:#5d5a66; --bad:#b8321f;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

header{position:fixed;inset:0 0 auto 0;z-index:10;background:var(--paper)}
header .in{max-width:760px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
.mark{font-family:var(--display);font-size:19px;text-decoration:none;white-space:nowrap}
.close{font-weight:800;font-size:15px;text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--sun);text-underline-offset:4px;padding:6px}
.bar{height:6px;background:rgba(11,11,14,.1)}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s ease}

main{position:fixed;inset:64px 0 0 0;overflow:hidden}
.q{position:absolute;inset:0;overflow-y:auto;display:flex;padding:24px max(20px,env(safe-area-inset-right,0px)) 110px max(20px,env(safe-area-inset-left,0px));
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
.q .box{margin:auto;width:100%;max-width:640px;display:flex;flex-direction:column;gap:18px}
.q.below{transform:translateY(60px);opacity:0;pointer-events:none}
.q.above{transform:translateY(-60px);opacity:0;pointer-events:none}
.kicker{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kicker .n{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--sun);border:2px solid var(--ink);color:var(--ink);letter-spacing:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,52px);line-height:1.02;margin:0;letter-spacing:.02em}
h1 .hl{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%)}
h2{font-weight:800;font-size:clamp(23px,4.6vw,30px);line-height:1.2;margin:0;text-wrap:pretty}
.help{font-weight:600;color:var(--muted);margin:-6px 0 0}
p{margin:0}
.lede{font-size:19px;font-weight:600}
.lede+.lede{margin-top:-4px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 16px 12px 12px;background:#fff;border:3px solid var(--ink);border-radius:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover{background:var(--card)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);font-size:13px;font-weight:800;background:var(--paper)}
.opt[aria-pressed="true"]{background:var(--sun)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:#fff}
@media (hover:none){.opt .k{display:none}.opt{padding-left:16px}}

.field{width:100%;background:transparent;border:0;border-bottom:3px solid var(--ink);padding:8px 2px;font-size:22px;font-weight:700;outline:0;border-radius:0}
.field:focus{border-bottom-color:var(--navy)}
textarea.field{resize:none;min-height:3.2em;line-height:1.35}
.money{display:flex;align-items:baseline;gap:6px;font-size:28px;font-weight:800}
.money .field{font-size:28px;max-width:200px}
.field::placeholder{color:#a9a5af}

.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;background:var(--sun);border:3px solid var(--ink);
  font-family:var(--display);font-size:17px;letter-spacing:.03em;text-decoration:none;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.pill.ghost{background:#fff}
.hint{font-size:14px;font-weight:700;color:var(--muted)}
.skip{font-weight:800;font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:6px}
.note{font-size:15px;font-weight:700;background:var(--card);border:2px dashed var(--ink);border-radius:14px;padding:10px 14px}
.pick{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pick:hover{background:var(--card)}
.pick:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.pick .pt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pick b{font-size:20px;font-weight:800}
.pick .ps{font-weight:600;color:var(--muted)}
.tag{font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;background:var(--paper)}
.tag.done{background:var(--sun)}
.reveal{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reveal div{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center}
.reveal b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.reveal span{font-weight:700;font-size:15px;color:var(--muted)}
.reveal p{grid-column:1/-1;font-weight:700;text-align:center}

nav.arrows{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:8px}
nav.arrows button{width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;font-weight:800;line-height:1}
nav.arrows button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header>
  <div class="in"><a class="mark" href="login.html?v=1794162084#account">Little Worlds</a><a class="close" href="login.html?v=1794162084#account" id="closeLink">Save and close</a></div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>
<main id="stage" aria-live="polite"></main>
<nav class="arrows" aria-label="Questions"><button id="up" aria-label="Previous question">↑</button><button id="down" aria-label="Next question">↓</button></nav>

<script>
(()=>{
/* Paste the Google Apps Script web app URL here. Empty = answers stay in this browser only. */
const ENDPOINT='https://script.google.com/macros/s/AKfycbwbbqG4tg3LQxXu0mWkWmoInMumnrYscPdz3NKcc3wwZyCV2W4cjdMg4eBUlJ2EKEWw/exec';
const STORE='lw_feedback_v2';
/* Opened from a shared link without being logged in: close and back go to the front page instead of the login screen. */
let HOME=document.querySelector('.close').getAttribute('href'),loggedIn=true;try{loggedIn=!!localStorage.getItem('lw_session')}catch(e){}
if(!loggedIn){HOME='index.html';document.querySelectorAll('header a').forEach(x=>x.href=HOME)}

/* Two forms, one row per person in the sheet (they share the response id on the same phone or tablet).
   Part 1 (feedback.html): the first go, sent the same day, while set-up is fresh.
   Part 2 (feedback.html?part=2): after 3 to 5 days of play.
   type: intro | choice | text | long | money | statement | end
   key: the column name in the sheet. show: only ask when this returns true. */
const PARAM=new URLSearchParams(location.search).get('part');
const PART=PARAM==='2'?2:1;
/* No part picked yet: show the two sets of questions and let the person choose. */
if(!PARAM){
  let st={};try{st=JSON.parse(localStorage.getItem(STORE)||'{}').parts||{}}catch(e){}
  const tag=n=>{const p=st[n]||{};return p.done?'<span class="tag done">Done ✓</span>':p.i?'<span class="tag">Started</span>':''};
  const card=(n,title,sub)=>`<a class="pick" href="feedback.html?v=1794162084&part=${n}"><span class="pt"><b>${title}</b>${tag(n)}</span><span class="ps">${sub}</span></a>`;
  document.querySelector('#stage').innerHTML=`<section class="q"><div class="box">
    <p class="kicker">Feedback</p>
    <h1>Help us decide <span class="hl">what happens next</span></h1>
    <p class="lede">Pick the questions that fit where you are now.</p>
    <div class="opts">${card(1,'Right after setting up the game','Takes about 3 minutes. Set-up, the character and the first go.')}${card(2,'After playing a few times','Takes about 5 minutes. How often they play, the trips and the price.')}</div>
    <p class="note">We don’t attach your name, email or account to your answers, so we can’t see who wrote what.</p>
  </div></section>`;
  document.querySelector('nav.arrows').hidden=true;document.querySelector('.bar').hidden=true;document.querySelector('#closeLink').textContent='Close';
  return;
}
const ADULT=a=>['Me','Another adult'].includes(a['A00 Who played']);
const WHO={sec:'About you',key:'A00 Who played',type:'choice',q:'Who played the game?',help:'If you didn’t see them play, ask the adult who did before you answer.',opts:['Me','My child','My grandchild','My niece or nephew','My godchild','A friend’s child','Another adult','Someone else']};
const AGE={sec:'About you',key:'A01 Player age',type:'choice',q:'How old is the player?',opts:['Under 4','4 or 5','6 or 7','8 or 9','10 to 12','13 to 17','18 or older']};
const FIRST=[
  WHO,AGE,
  {sec:'Setting it up',key:'A03 Where stuck in set-up',type:'long',q:'Where did you get stuck, slow down or feel unsure while setting up?',help:'If nowhere, write “nowhere”.'},
  {sec:'Setting it up',key:'A04 Set-up time',type:'choice',q:'How long did set-up take?',opts:['Under 2 minutes','2 to 5 minutes','5 to 10 minutes','Over 10 minutes','I gave up']},
  {sec:'Setting it up',key:'A05 Confusing or pointless',type:'long',q:'Which part of the page felt confusing or pointless?',help:'Skip this if none did.'},
  {sec:'The character',key:'A06 First reaction',type:'long',q:'When the player first saw the character, what did they say or do?',help:'Write their words if you remember them.'},
  {sec:'The character',key:'A07 Looks like player',type:'choice',q:'How close was the character to the player’s real look?',opts:['Not close','A bit close','Close','Very close']},
  {sec:'The character',key:'A08 Looked for, not found',type:'long',q:'Which look did you search for and not find?',help:'A hairstyle, an outfit, a colour, something to wear. Skip this if you found it all.'},
  {sec:'Home screen',key:'A10 On home screen',type:'choice',q:'Is the game on your home screen now?',opts:['Yes','I tried and gave up','I didn’t try']},
  {sec:'Home screen',key:'A11 What got in the way',type:'long',q:'What got in the way of adding it?',show:a=>a['A10 On home screen']&&a['A10 On home screen']!=='Yes'},
  {sec:'Home screen',key:'A12 Device',type:'choice',q:'Which device does the player play on?',opts:['Apple phone','Android phone','Apple tablet','Android tablet','Something else']},
  {sec:'The first go',key:'A13 First go length',type:'choice',q:'How long did the first go last?',opts:['Under 5 minutes','5 to 15 minutes','15 to 30 minutes','Over 30 minutes']},
  {sec:'The first go',key:'A14 What ended first go',type:'choice',q:'What ended the first go?',opts:['They got bored','They got stuck','Time ran out (bedtime, dinner, school)','They finished the trips that were open','Something else']},
  {sec:'The first go',key:'A16 Anything else first go',type:'long',q:'Anything else you noticed during the first go?',help:'Skip this if not.'},
];
const LATER=[
  Object.assign({},WHO,{show:a=>!a['A00 Who played']}),
  Object.assign({},AGE,{show:a=>!a['A01 Player age']}),
  {sec:'Playing',key:'B02 Times went back',type:'choice',q:'Over the past few days, how many times did you go back to the game?',opts:['None','1 or 2','3 to 5','6 or more'],show:ADULT},
  {sec:'Playing',key:'B05 Stuck or needed help',type:'long',q:'Where did the player get stuck or ask for help?',help:'Skip this if they didn’t.'},
  {sec:'Playing',key:'B06 Talked about after',type:'long',q:'Which part did the player talk about afterwards?',help:'Skip this if they didn’t.'},
  {sec:'Playing',key:'B08 Sound turned off',type:'choice',q:'Did anyone turn the sound off?',opts:['No','Yes']},
  {sec:'Playing',key:'B09 Why sound off',type:'text',q:'Why did they turn the sound off?',show:a=>a['B08 Sound turned off']==='Yes'},
  {sec:'Trips',key:'B10 Places wanted next',type:'text',q:'Name up to three places the player would want to run through next.',ph:'Places, cities or countries'},
  {sec:'Trips',key:'B11 After last trip',type:'choice',q:'When the player reached the last trip, how did they feel?',opts:['They wanted more','They’d had enough','They haven’t reached it yet']},
  {sec:'Trips',key:'B12 Five trips feels',type:'choice',q:'Five trips per player feels:',opts:['Too few','About right','Too many','Not sure yet']},
  {sec:'Price',key:'B13 Expected price per month',type:'money',q:'A game like this, made for one player: how much per month would you expect it to cost?'},
  {sec:'Price',key:'B14 Too expensive at',type:'money',q:'At what monthly price would it feel too expensive to consider?'},
  {sec:'Price',key:'B15 Too cheap at',type:'money',q:'At what monthly price would it feel so cheap you’d doubt the quality?'},
  {sec:'Price',key:'B16 What stops other families',type:'long',q:'Think of families you know. What would stop them paying for this?'},
  {sec:'Price',type:'statement'},
  {sec:'Price',key:'B17 With these prices',type:'choice',q:'With these prices, what would you do?',opts:['Join, paying monthly','Join, paying yearly','Wait until there are more trips','Not join']},
  {sec:'Price',key:'B18 Plan',type:'choice',q:'Which plan would you pick?',opts:['One game','Family plan, for 2 games','Family plan, for 3 games','Family plan, for 4 games'],show:a=>/^Join/.test(a['B17 With these prices']||'')},
  {sec:'Price',key:'B19 Buy as a present',type:'choice',q:'Would you buy one as a present for someone else?',opts:['Yes','Maybe','No']},
  {sec:'Last questions',key:'B20 If it disappeared',type:'choice',q:'If the game disappeared tomorrow, how would you feel?',opts:['Very disappointed','A bit disappointed','Not disappointed']},
  {sec:'Last questions',key:'B21 One sentence to a friend',type:'long',q:'Describe the game to a friend in one sentence.'},
  {sec:'Last questions',key:'B22 Change worth paying',type:'long',q:'Name one change that would make it worth paying for.'},
  {sec:'Last questions',key:'B23 Told anyone',type:'choice',q:'Have you told anyone about the game yet?',opts:['Yes','No']},
];
const QS=[{type:'intro'}].concat(PART===2?LATER:FIRST,[{type:'end'}]);
const DONEKEY=['','First go form finished','After a few days form finished'];
const COLUMNS=[...new Set(FIRST.concat(LATER).filter(x=>x.key).map(x=>x.key))].concat(DONEKEY[1],DONEKEY[2]);
const NUMBERED=QS.filter(x=>x.key);

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const touch=matchMedia('(hover:none)').matches;
let S={id:'',answers:{},parts:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
if(!S.id)S.id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const P=S.parts[PART]=S.parts[PART]||{i:0,done:false};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};
if(P.done)P.i=QS.length-1;

/* Send all answers so far. The sheet keeps one row per id and overwrites it, so a parent who stops halfway still counts. */
let sending=Promise.resolve();
function send(finished){
  if(!ENDPOINT)return;
  const body=JSON.stringify({id:S.id,columns:COLUMNS,answers:S.answers,finished:!!(S.parts[2]&&S.parts[2].done),page:location.pathname});
  sending=sending.then(()=>fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true})
    .then(()=>{S.unsent=false;save()}).catch(()=>{S.unsent=true;save()}));
}
if(S.unsent)send();

const visible=i=>{const x=QS[i];return !x.show||x.show(S.answers)};
const step=(i,d)=>{do{i+=d}while(i>0&&i<QS.length-1&&!visible(i));return Math.max(0,Math.min(QS.length-1,i))};
const numOf=x=>NUMBERED.filter(y=>!y.show||y.show(S.answers)).indexOf(x)+1;
const total=()=>NUMBERED.filter(y=>!y.show||y.show(S.answers)).length;

function view(x){
  if(x.type==='intro')return `<p class="kicker">${PART===2?'Feedback, part 2 · about 5 minutes':'Feedback, part 1 · about 3 minutes'}</p>
    <h1>Help us decide <span class="hl">what happens next</span></h1>
    <p class="lede">${PART===2?'These questions cover the last few days of play, and what you’d pay.':'These questions cover set-up and the first go, while you still remember them.'}</p>
    <p class="lede">A harsh answer helps us more than a kind one. If something bored you, confused you or put you off, please say so.</p>
    <p class="note">We don’t attach your name, email or account to your answers, so we can’t see who wrote what.</p>
    <div class="row"><button class="pill" data-next>Start</button><span class="hint">${touch?'':'or press Enter ↵'}</span></div>`;
  if(x.type==='end')return `<p class="kicker">All done</p><h1>Thank <span class="hl">you</span></h1>
    <p class="lede">Your answers are with us now. ${PART===2?'We use them to decide what to build next.':'Once the player has had a few more goes, come back and answer the second set of questions.'}</p>
    ${ENDPOINT?'':'<p class="note">Test version: the answers are saved in this browser only.</p>'}
    <div class="row"><a class="pill" href="${HOME}">${loggedIn?'Back to your account':'Back to Little Worlds'}</a><button class="skip" data-act="again">Change an answer</button></div>`;
  const head=`<p class="kicker"><span class="n">${x.type==='statement'?'£':numOf(x)}</span>${esc(x.sec)}</p>`;
  if(x.type==='statement')return head+`<h2>Here are the prices we’re thinking about.</h2>
    <div class="reveal"><div><b>£3</b><span>a month for one child</span></div><div><b>£6</b><span>a month for up to four children</span></div>
    <p>Paying yearly costs the price of 10 months for 12.</p></div>
    <div class="row"><button class="pill" data-next>Next</button></div>`;
  const v=S.answers[x.key];
  let body='';
  if(x.type==='choice')body=`<div class="opts" role="group" aria-label="${esc(x.q)}">${x.opts.map((o,j)=>`<button class="opt" data-opt="${esc(o)}" aria-pressed="${v===o}"><span class="k">${String.fromCharCode(65+j)}</span>${esc(o)}</button>`).join('')}</div>
    <div class="row"><button class="skip" data-skip>Skip</button></div>`;
  else{
    const inp=x.type==='long'?`<textarea class="field" rows="2" placeholder="${esc(x.ph||'Type your answer')}" aria-label="${esc(x.q)}">${esc(v||'')}</textarea>`
      :x.type==='money'?`<div class="money">£<input class="field" type="text" inputmode="decimal" placeholder="0.00" aria-label="${esc(x.q)}" value="${esc(v??'')}"></div>`
      :`<input class="field" type="text" placeholder="${esc(x.ph||'Type your answer')}" aria-label="${esc(x.q)}" value="${esc(v||'')}">`;
    body=inp+`<div class="row"><button class="pill" data-ok>OK</button><span class="hint">${touch?'':x.type==='long'?'Enter ↵ to go on · Shift + Enter for a new line':'or press Enter ↵'}</span><button class="skip" data-skip>Skip</button></div>`;
  }
  return head+`<h2>${esc(x.q)}</h2>${x.help?`<p class="help">${esc(x.help)}</p>`:''}`+body;
}

let cur=null,busy=false;
function render(dir){
  const x=QS[P.i];
  const el=document.createElement('section');el.className='q '+(dir>0?'below':dir<0?'above':'');
  el.innerHTML=`<div class="box">${view(x)}</div>`;
  $('#stage').appendChild(el);
  const old=cur;cur=el;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.classList.remove('below','above');
    if(old){old.classList.add(dir>0?'above':'below');setTimeout(()=>old.remove(),520)}
  }));
  const f=el.querySelector('.field');
  if(f){f.addEventListener('keydown',onFieldKey);if(f.tagName==='TEXTAREA')autoGrow(f),f.addEventListener('input',()=>autoGrow(f));if(!touch)setTimeout(()=>f.focus({preventScroll:true}),dir?420:0)}
  const n=total(),k=x.key?numOf(x):x.type==='end'?n:x.type==='intro'?0:numOf(QS[step(P.i,-1)]);
  $('#bar').style.width=(x.type==='end'?100:Math.round(k/n*100))+'%';
  $('#up').disabled=P.i===0;$('#down').disabled=x.type==='end'||x.type==='intro';
  $('#closeLink').textContent=x.type==='end'?'Close':'Save and close';
}
const autoGrow=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,260)+'px'};

function go(d){
  if(busy)return;const to=step(P.i,d);if(to===P.i)return;
  busy=true;setTimeout(()=>busy=false,450);
  P.i=to;
  if(QS[to].type==='end'&&!P.done){P.done=true;P.at=Date.now();S.answers[DONEKEY[PART]]='Yes';send()}
  save();render(d);
}
function answer(val){
  const x=QS[P.i];if(!x.key)return go(1);
  if(val===''||val==null)delete S.answers[x.key];else S.answers[x.key]=val;
  save();send();go(1);
}
function readField(){
  const x=QS[P.i],f=cur.querySelector('.field');if(!f)return null;
  let v=f.value.trim();
  if(x.type==='money'&&v!==''){const n=parseFloat(v.replace(/[£,\s]/g,''));if(isNaN(n)||n<0){f.setCustomValidity('x');shake(f);return undefined}v=Math.round(n*100)/100}
  return v;
}
const shake=f=>{f.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:260});f.style.borderBottomColor='var(--bad)'};
function onFieldKey(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const v=readField();if(v!==undefined)answer(v)}
}

document.addEventListener('click',e=>{
  const o=e.target.closest('[data-opt]');
  if(o){if(busy)return;cur.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===o));const v=o.dataset.opt;setTimeout(()=>answer(v),260);return}
  if(e.target.closest('[data-next]'))return go(1);
  if(e.target.closest('[data-ok]')){const v=readField();if(v!==undefined)answer(v);return}
  if(e.target.closest('[data-skip]')){const x=QS[P.i];if(x.key&&!(x.key in S.answers)){S.answers[x.key]='(skipped)';save();send()}return go(1)}
  if(e.target.closest('[data-act="again"]')){P.done=false;delete S.answers[DONEKEY[PART]];P.i=step(QS.length-1,-1);save();render(-1);return}
});
$('#up').onclick=()=>go(-1);
$('#down').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(e.target.closest('.field'))return;
  const x=QS[P.i];
  if(e.key==='Enter'){const b=cur.querySelector('[data-next]');if(b){e.preventDefault();go(1)}return}
  if(x.type==='choice'&&/^[a-z]$/i.test(e.key)&&!e.metaKey&&!e.ctrlKey){const b=cur.querySelectorAll('.opt')[e.key.toUpperCase().charCodeAt(0)-65];if(b)b.click()}
  if(e.key==='ArrowUp'&&P.i>0){e.preventDefault();go(-1)}
  if(e.key==='ArrowDown'&&x.type!=='intro'&&x.type!=='end'){e.preventDefault();go(1)}
});
/* Flush on leave, so a half-finished form still reaches the sheet. */
addEventListener('pagehide',()=>{save()});

render(0);
window.__fb={QS,S,P,go,answer,COLUMNS};
})();
</script>
</body></html>
